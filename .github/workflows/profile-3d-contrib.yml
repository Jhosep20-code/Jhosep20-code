name: GitHub-Profile-3D-Contrib

on:
  schedule: # se regenera todos los días a la 1:00 AM hora de Perú (06:00 UTC)
    - cron: "0 6 * * *"
  workflow_dispatch: {} # también la puedes correr manualmente desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: update 3D contribution graph"; then
            git push
          fi
